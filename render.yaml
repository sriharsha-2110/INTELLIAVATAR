services:
  # 1. INTELLIAVATAR 2.0 Backend Web Service (Node.js / Express / TypeScript)
  - type: web
    name: intelliavatar-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        value: https://intelliavatar-frontend.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AVATAR_PROVIDER_API_KEY
        sync: false
      - key: AVATAR_PROVIDER_BASE_URL
        value: https://api.avatarsdk.com
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        value: eastus

  # 2. INTELLIAVATAR 2.0 Frontend Static Site (React 18 / Vite / Three.js)
  - type: web
    name: intelliavatar-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # React Router SPA catch-all rewrite
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://intelliavatar-backend.onrender.com/api
